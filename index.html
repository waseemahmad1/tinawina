<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./style/css/styles.css">
  </head> 
  <body>
    <div class="container">
      <div>
        <h1 class="header_text">Do you wanna go out with me ehe</h1>
      </div>
      <div class="gif_container">
        <img src="https://media.giphy.com/media/LnKonfpQ44fNvuGLkA/giphy.gif" alt="Cute animated illustration">
      </div>
      <div class="buttons">
        <button class="btn" id="yesButton" onclick="nextPage()">Yes</button>
        <button class="btn" id="noButton" onmouseover="moveButton()">No</button>
        <!-- Added Next button -->
        <button class="btn" id="nextButton" onclick="goToNext()">Next</button>
      </div>
    </div>
    
    <script>
      function nextPage() {
        window.location.href = "yes.html";
      }
      
      function moveButton() {
        var noBtn = document.getElementById('noButton');
        var x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        var y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
      }
      
      // New function for the Next button
      function goToNext() {
        window.location.href = "next.html";
      }
    </script>
  </body> 
</html>
